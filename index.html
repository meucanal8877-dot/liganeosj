<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<link rel="icon" type="image/png" href="logo-liga.png">
<meta property="og:title" content="Liga Neo SJ">
<meta property="og:description" content="Fut7 na Arena Lobos, São José dos Ramos (PB). Seja você o protagonista desse jogo!">
<meta property="og:image" content="/logo-liga.png">
<title>Liga Neo SJ</title>
<meta name="description" content="Site oficial da Liga Neo SJ: Fut7 na Arena Lobos, em São José dos Ramos (PB). Jogos, resultados, artilharia, assistências, times e campeões.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: noite de jogo sob refletores. Faixas de largura total com conteúdo em coluna central;
   placar no estilo de painel de estádio; azul (AL EC) x vermelho (AL FC), dourado para títulos. */
:root{
  color-scheme: dark;
  --bg:#060a14; --bg2:#0a1121; --card:#0f182d; --card2:#15213b; --card3:#1b2a4a;
  --line:#21314f; --line2:#2d4370;
  --fg:#eef3ff; --mut:#a3b3d1; --dim:#7387ad;
  --blue:#2f6dff; --blue2:#79a3ff; --blue-bg:#0f2350;
  --red:#e5303f; --red2:#ff7d87; --red-bg:#3c0f18;
  --gold:#f2b632; --gold2:#ffd772; --gold-bg:#3a2c08;
  --silver:#c9d3e6; --bronze:#d98b4e;
  --ok:#3fcf8e; --ok-bg:#0d3326; --err:#ff6b6b; --err-bg:#3d1216;
  --ink:#060a14;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r2:22px;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:1000px){body{padding-bottom:0}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--blue2)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3,h4{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(1.6rem,4vw,2.25rem);font-weight:800;text-transform:uppercase}
h3{font-size:1.3rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin-inline:auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--gold);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:700;border:0;cursor:pointer}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* Cabeçalho */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(6,10,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0}
.brand img{width:38px;height:45px;object-fit:contain}
.brand b{font-family:var(--display);font-weight:800;font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:.72rem;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;font-weight:600;line-height:1}
.topnav{display:none;margin-left:auto;gap:2px}
.topnav a{color:var(--mut);text-decoration:none;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1rem;padding:8px 10px;border-radius:8px}
.topnav a:hover{color:var(--fg);background:var(--card)}
.topnav a[aria-current="page"]{color:var(--fg);box-shadow:inset 0 -3px 0 var(--gold)}
.hdr-actions{display:flex;gap:6px;margin-left:auto}
@media (min-width:1000px){.topnav{display:flex}.hdr-actions{margin-left:6px}}
.ibtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;flex:none}
.ibtn:hover{background:var(--card2);border-color:var(--line2)}
.ibtn svg{width:20px;height:20px}
.ico{width:1.1em;height:1.1em;flex:none;vertical-align:-.15em}
svg.ico,.ibtn svg,.btn svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Navegação inferior (celular) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,17,33,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--mut);text-decoration:none;background:none;border:0;font-size:.72rem;font-weight:600;cursor:pointer;border-radius:10px}
.bnav svg{width:22px;height:22px}
.bnav [aria-current="page"]{color:var(--gold2)}
@media (min-width:1000px){.bnav{display:none}}

/* Gaveta de menu */
.drawer{position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end;background:rgba(3,6,12,.6)}
.drawer-panel{width:min(360px,100%);height:100%;overflow-y:auto;background:var(--bg2);border-left:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:6px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer a{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em}
.drawer a:hover{background:var(--card)}
.drawer a[aria-current="page"]{background:var(--card2);color:var(--gold2)}
.drawer a svg{width:20px;height:20px;color:var(--mut)}
.drawer hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}

/* Busca */
.search{position:fixed;inset:0;z-index:85;background:rgba(3,6,12,.82);display:flex;justify-content:center;align-items:flex-start;padding:calc(70px + env(safe-area-inset-top,0px)) var(--gut-r) 20px var(--gut-l)}
.search-box{width:min(680px,100%);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;max-height:80vh;display:flex;flex-direction:column}
.search-in{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.search-in input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:1.1rem;padding:8px 4px}
.search-res{overflow-y:auto;padding:8px}
.sres{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;text-decoration:none;color:var(--fg)}
.sres:hover,.sres:focus-visible{background:var(--card)}
.sres img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--card2)}
.sres small{display:block;color:var(--mut);font-size:.8rem}
.sres-k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:10px 10px 4px}

/* Botões e chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--fg);text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.08rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card3)}
.btn svg{width:18px;height:18px}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold2)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-blue:hover{background:#4a80ff}
.btn-red{background:var(--red-bg);border-color:var(--red);color:var(--red2)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.95rem;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.st-enc{background:var(--card3);color:var(--mut)}
.st-age{background:var(--ok-bg);color:var(--ok)}
.st-agu,.st-adi{background:var(--gold-bg);color:var(--gold2)}
.st-can{background:var(--err-bg);color:var(--err)}
.tbc{color:var(--dim);font-style:italic;font-weight:500}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-size:.92rem}
.muted{color:var(--mut)}
.small{font-size:.88rem}

/* Seções */
main{display:block;min-height:60vh}
.band{padding-block:44px}
.band-alt{background:var(--bg2);border-block:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.sec-head > div{display:grid;gap:6px;min-width:0}
.sec-head p{color:var(--mut);max-width:62ch}
.page-head{padding-block:34px 8px}
.page-head .wrap{display:grid;gap:10px}
.page-head p{color:var(--mut);max-width:65ch;font-size:1.05rem}
.crumbs{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--mut)}
.crumbs a{color:var(--mut)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.g5{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px;min-width:0}
.card h3{margin-bottom:8px}
.empty{border:1px dashed var(--line2);border-radius:var(--r2);padding:26px 20px;text-align:center;color:var(--mut);display:grid;gap:10px;justify-items:center}
.empty svg{width:30px;height:30px;color:var(--dim)}
.empty b{color:var(--fg);font-family:var(--display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--mut);font-size:.92rem}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--blue2)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}
.sel{display:grid;gap:4px;min-width:0}
.sel label{font-size:.75rem;color:var(--dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sel select,.sel input{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-height:42px;max-width:100%}

/* Hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
  radial-gradient(60% 70% at 12% 0%, rgba(47,109,255,.28), transparent 70%),
  radial-gradient(50% 60% at 95% 10%, rgba(229,48,63,.22), transparent 70%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 90px, transparent 90px 180px),
  var(--bg)}
.hero::after{content:"";position:absolute;left:50%;bottom:-180px;width:360px;height:360px;transform:translateX(-50%);border:2px solid rgba(255,255,255,.06);border-radius:50%;pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;gap:28px;padding-block:36px 44px;grid-template-columns:1fr}
@media (min-width:900px){.hero .wrap{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:center;padding-block:56px}}
.hero-main{display:grid;gap:20px;min-width:0}
.hero-id{display:flex;align-items:center;gap:16px}
.hero-id img{width:92px;height:110px;object-fit:contain}
.hero-id div{display:grid;gap:2px}
.hero-id b{font-family:var(--display);font-size:2rem;font-weight:800;text-transform:uppercase;line-height:1}
.hero-id span{color:var(--mut);font-weight:600;font-size:.95rem}
.slogan{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,8.5vw,5.2rem);line-height:.92;letter-spacing:-.005em}
.slogan em{color:var(--gold);font-style:italic;display:inline-block}
.hero-sub{color:var(--mut);font-size:1.08rem;max-width:56ch}
.hero-side{display:grid;gap:14px;min-width:0}

/* Placar */
.board{background:linear-gradient(180deg,#0c1529,#0a1120);border:1px solid var(--line2);border-radius:var(--r2);padding:16px 18px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.board-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.bteam{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.bteam img{width:54px;height:58px;object-fit:contain}
.bteam span{font-family:var(--display);font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:.03em}
.bscore{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;padding:6px 14px;border-radius:12px;background:#050912;border:1px solid var(--line)}
.bscore i{font-style:normal;color:var(--dim);font-size:1.6rem}
.bscore.tbcs{font-size:1rem;color:var(--mut);font-style:italic;font-weight:600;padding:12px;text-transform:none;max-width:120px;text-align:center}
.board-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:.88rem;color:var(--mut)}
.win-tag{color:var(--gold2);font-weight:700}

/* Cartão de partida */
.mcard{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;color:var(--fg);text-decoration:none;transition:border-color .15s, transform .15s}
.mcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.mc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mc-title{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.mc-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.mc-team img{width:46px;height:50px;object-fit:contain}
.mc-team span{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1rem}
.mc-team.win span{color:var(--gold2)}
.mc-score{font-family:var(--display);font-weight:800;font-size:2.2rem;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.mc-score i{font-style:normal;color:var(--dim);font-size:1.2rem}
.mc-score.tbcs{font-size:.9rem;color:var(--mut);font-weight:600;font-style:italic;text-align:center;max-width:96px;line-height:1.2}
.mc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:.88rem}
.mc-meta span{display:inline-flex;gap:6px;align-items:center}

/* Jogadores */
.pcard{position:relative;display:grid;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;color:var(--fg);text-decoration:none;transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-3px);border-color:var(--line2)}
.pcard-img{position:relative;aspect-ratio:1/1;max-width:100%;background:linear-gradient(160deg,var(--blue-bg),var(--card2) 60%,var(--red-bg))}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pnum{position:absolute;top:10px;left:10px;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;background:rgba(6,10,20,.82);border:1px solid var(--line2);border-radius:10px;padding:6px 8px;font-variant-numeric:tabular-nums}
.ppos{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:800;letter-spacing:.1em;background:var(--gold);color:var(--ink);border-radius:8px;padding:4px 7px}
.pcard-body{padding:12px 14px 14px;display:grid;gap:4px}
.pcard-body b{font-family:var(--display);font-size:1.35rem;font-weight:800;text-transform:uppercase;line-height:1}
.pcard-body small{color:var(--mut);font-size:.85rem}
.pstats{display:flex;gap:12px;margin-top:6px;font-size:.85rem;color:var(--mut)}
.pstats strong{color:var(--fg);font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}

/* Ranking */
.rk{display:grid;gap:8px}
.rk-row{display:grid;grid-template-columns:44px 48px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;color:var(--fg);text-decoration:none}
.rk-row:hover{border-color:var(--line2)}
.rk-pos{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-family:var(--display);font-weight:800;font-size:1.3rem;background:var(--card2);font-variant-numeric:tabular-nums}
.m1{background:var(--gold);color:var(--ink)} .m2{background:var(--silver);color:var(--ink)} .m3{background:var(--bronze);color:var(--ink)}
.rk-row img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--card2)}
.rk-name{min-width:0}
.rk-name b{display:block;font-family:var(--display);font-weight:800;font-size:1.2rem;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.rk-name small{color:var(--mut);font-size:.82rem}
.rk-val{font-family:var(--display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.rk-val small{display:block;font-family:var(--body);font-size:.7rem;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tie{font-size:.68rem;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.leader{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:linear-gradient(120deg,var(--gold-bg),var(--card) 55%);border:1px solid #5c4612;border-radius:var(--r2);padding:16px;margin-bottom:14px}
.leader img{width:110px;height:110px;border-radius:18px;object-fit:cover}
.leader .lv{font-family:var(--display);font-weight:800;font-size:3rem;line-height:.9;color:var(--gold2);font-variant-numeric:tabular-nums}
.leader .eyebrow{display:block;margin-bottom:4px}
.leader b{display:block;font-family:var(--display);font-size:1.8rem;font-weight:800;text-transform:uppercase;line-height:1}
.leaders-multi{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.leaders-multi a{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-weight:700}
.leaders-multi img{width:40px;height:40px;border-radius:10px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto;margin-bottom:16px}
.tab{flex:1 0 auto;border:0;background:none;color:var(--mut);font-family:var(--display);font-weight:700;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--ink)}

/* Barras e gráficos */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:.92rem}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-track{height:14px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--blue)}
.bar b{font-family:var(--display);font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cmp{display:grid;gap:12px}
.cmp-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto minmax(0,1fr) 44px;align-items:center;gap:8px;font-size:.9rem}
.cmp-row .l{text-align:right;font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.cmp-row .r{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.cmp-row .lab{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;text-align:center;min-width:92px}
.cmp-bar{height:12px;border-radius:999px;background:var(--card2);overflow:hidden;display:flex}
.cmp-bar.left{justify-content:flex-end}
.cmp-bar i{display:block;height:100%;border-radius:999px}
.cmp-heads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.cmp-head{display:flex;align-items:center;gap:10px;min-width:0}
.cmp-head:last-child{flex-direction:row-reverse;text-align:right}
.cmp-head img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.cmp-head b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}

/* Destaque / campeão */
.champ{position:relative;display:grid;gap:18px;grid-template-columns:auto minmax(0,1fr);align-items:center;background:linear-gradient(135deg,#1a1505,var(--card) 50%,var(--blue-bg));border:1px solid #5c4612;border-radius:var(--r2);padding:22px;overflow:hidden}
.champ img.crest{width:110px;height:120px;object-fit:contain}
.champ .eyebrow{display:flex;align-items:center;gap:8px}
.champ h3{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;text-transform:uppercase;margin:4px 0 6px}
.champ-facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);font-size:.92rem}
.champ-facts b{color:var(--fg)}
@media (max-width:520px){.champ,.leader{grid-template-columns:1fr;text-align:left}.champ img.crest{width:84px;height:92px}}
.spot{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.spot img{border-radius:16px;aspect-ratio:516/600;object-fit:cover;width:100%;max-width:100%}
.spot b.big{font-family:var(--display);font-size:2.4rem;font-weight:800;text-transform:uppercase;line-height:.95;display:block;margin:4px 0}
@media (max-width:560px){.spot{grid-template-columns:110px minmax(0,1fr);gap:14px}.spot b.big{font-size:1.7rem}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* Notícias, mídia e galeria */
.ncard{display:grid;grid-template-rows:auto 1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;color:var(--fg);text-decoration:none}
.ncard:hover{border-color:var(--line2)}
.nimg{aspect-ratio:16/10;max-width:100%;background:radial-gradient(70% 90% at 20% 10%,var(--blue-bg),var(--card2));display:grid;place-items:center;overflow:hidden}
.nimg img{width:100%;height:100%;object-fit:cover}
.nimg img.contain{object-fit:contain;padding:18px;width:auto;max-height:100%}
.nbody{padding:14px 16px 18px;display:grid;gap:8px;align-content:start}
.nbody h3{font-size:1.35rem;line-height:1.1}
.nbody p{color:var(--mut);font-size:.94rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--dim);font-weight:600}
.cat{color:var(--gold2);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.article{max-width:760px}
.article .lead-img{border-radius:var(--r2);border:1px solid var(--line);max-height:520px;object-fit:contain;background:var(--card);width:100%;margin-block:18px}
.article p{font-size:1.1rem;line-height:1.7;margin-bottom:16px;max-width:65ch}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.vcard video{width:100%;aspect-ratio:9/16;max-height:520px;background:#000;max-width:100%}
.vthumb{position:relative;aspect-ratio:9/12;max-width:100%;display:grid;place-items:center;background:radial-gradient(70% 70% at 30% 20%,var(--red-bg),var(--card2) 60%,var(--blue-bg));color:var(--fg);text-decoration:none;overflow:hidden}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.vthumb .play{position:relative;width:68px;height:68px;border-radius:50%;background:rgba(6,10,20,.75);border:2px solid var(--fg);display:grid;place-items:center}
.vthumb .play svg{width:28px;height:28px;fill:var(--fg);stroke:none;margin-left:4px}
.vthumb .src{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;font-size:.8rem;font-weight:700;background:rgba(6,10,20,.8);padding:5px 10px;border-radius:999px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:12px}
.gal button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0;overflow:hidden;cursor:zoom-in;aspect-ratio:1/1;max-width:100%}
.gal img{width:100%;height:100%;object-fit:cover}
.gal img.contain{object-fit:contain;padding:14px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(3,6,12,.94);display:grid;place-items:center;padding:calc(60px + env(safe-area-inset-top,0px)) var(--gut-r) calc(30px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.lb img{max-height:80vh;max-width:100%;border-radius:12px;object-fit:contain}
.lb figcaption{text-align:center;color:var(--mut);margin-top:10px}
.lb .ibtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px))}

/* Times */
.tcard{display:grid;gap:14px;justify-items:center;text-align:center;padding:26px 20px;border-radius:var(--r2);border:1px solid var(--line);text-decoration:none;color:var(--fg);position:relative;overflow:hidden}
.tcard img{width:140px;height:150px;object-fit:contain}
.tcard h3{font-size:1.7rem;text-transform:uppercase;font-weight:800}
.t-blue{background:linear-gradient(180deg,var(--blue-bg),var(--card) 70%);border-color:#24418a}
.t-red{background:linear-gradient(180deg,var(--red-bg),var(--card) 70%);border-color:#6a1d29}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* Linha do tempo */
.tl{display:grid;gap:0;position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl-item{position:relative;padding-bottom:22px}
.tl-item::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--bg)}
.band-alt .tl-item::before{box-shadow:0 0 0 4px var(--bg2)}
.tl-item time,.tl-item .tld{font-size:.82rem;color:var(--gold2);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tl-item h3{margin:2px 0 4px}
.tl-item p{color:var(--mut);max-width:65ch}

/* Regras */
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.rule-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card2);color:var(--gold2)}
.rule-ic svg{width:24px;height:24px}
.cardsym{width:18px;height:26px;border-radius:4px;display:block}
.cs-y{background:#f5c518}.cs-r{background:#e5303f}
.rule h3{font-size:1.25rem;margin-bottom:4px}
.rule p{color:var(--mut);font-size:.95rem}
.steps{counter-reset:s;display:grid;gap:12px}
.step{counter-increment:s;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.step::before{content:counter(s);display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:1.7rem}
.step h3{font-size:1.25rem;margin-bottom:4px}
.step p{color:var(--mut);font-size:.95rem}
.principal{background:linear-gradient(120deg,var(--blue-bg),var(--card) 60%,var(--red-bg));border:1px solid var(--line2);border-radius:var(--r2);padding:24px;display:grid;gap:10px}
.principal b{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;text-transform:uppercase;line-height:1}

/* Apoiadores */
.spon{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.spon-logo{background:#0b1222;aspect-ratio:1/1;width:100%;max-width:100%;padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.spon-logo img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.spon-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.spon-body .btns{margin-top:auto;padding-top:4px;flex-direction:column}
.spon-body .btns .btn{width:100%}
.nw{white-space:nowrap}
.spon-body b{font-family:var(--display);font-size:1.25rem;text-transform:uppercase;line-height:1.05}
.spon-body .btns{gap:6px}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.strip{grid-template-columns:repeat(5,minmax(0,1fr))}}
.strip a{background:#0b1222;border-radius:14px;aspect-ratio:1/1;max-width:100%;display:flex;align-items:center;justify-content:center;padding:10px;border:1px solid var(--line);overflow:hidden}
.strip img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.contact{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.9rem;user-select:all;overflow-wrap:anywhere}

/* Rodapé */
.ftr{border-top:1px solid var(--line);background:var(--bg2);margin-top:20px}
.ftr .wrap{padding-block:34px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ftr h4{font-size:1rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:10px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ftr a{color:var(--fg);text-decoration:none}
.ftr a:hover{color:var(--gold2)}
.ftr-brand{display:grid;gap:10px}
.ftr-brand img{width:64px;height:76px;object-fit:contain}
.ftr-bottom{border-top:1px solid var(--line);padding-block:14px;color:var(--dim);font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* Perfil e jogo */
.profile{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:820px){.profile{grid-template-columns:minmax(0,360px) minmax(0,1fr)}}
.profile-photo{border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,var(--blue-bg),var(--card2) 60%,var(--red-bg));position:relative;max-width:420px;width:100%}
.profile-photo img{width:100%;aspect-ratio:516/600;object-fit:cover}
.profile-photo .pnum{font-size:2.4rem;padding:8px 12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.fact span{display:block;font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.fact b{font-weight:600}
.mhead{background:linear-gradient(90deg,var(--blue-bg),var(--card) 40%,var(--card) 60%,var(--red-bg));border:1px solid var(--line2);border-radius:var(--r2);padding:22px 16px}
.mhead .board-row .bteam img{width:84px;height:92px}
.mhead .bteam span{font-size:1.25rem}
.mhead .bscore:not(.tbcs){font-size:3.6rem}
@media (max-width:480px){.mhead .board-row .bteam img{width:60px;height:66px}.mhead .bteam span{font-size:1rem}.mhead .bscore:not(.tbcs){font-size:2.6rem}}
.evlist{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:52px 26px minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ev .min{font-family:var(--display);font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.ev svg{width:20px;height:20px}
.links{display:grid;gap:8px}
.link-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);text-decoration:none}
.link-row:hover{border-color:var(--line2)}
.link-row span{flex:1;min-width:0}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);background:var(--card)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* Vídeo de apresentação */
.vfeature{display:grid;gap:22px;align-items:center;grid-template-columns:1fr}
@media (min-width:860px){.vfeature{grid-template-columns:minmax(0,340px) minmax(0,1fr)}}
.phone{border-radius:28px;overflow:hidden;border:6px solid #111a2e;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:340px;width:100%;margin-inline:auto}
.phone video{width:100%;aspect-ratio:9/16;display:block;max-width:100%}

/* Draft */
.draft{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.dteam{border-radius:var(--r2);border:1px solid var(--line);padding:18px;display:grid;gap:14px;align-content:start}
.dteam-head{display:flex;align-items:center;gap:14px}
.dteam-head img{width:64px;height:70px;object-fit:contain}
.dteam-head h3{font-size:1.6rem;text-transform:uppercase;font-weight:800}
.dline{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;background:rgba(6,10,20,.55);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;color:var(--fg);text-decoration:none}
.drow:hover{border-color:var(--line2)}
.drow img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--card2)}
.drow b{display:block;font-family:var(--display);font-size:1.25rem;text-transform:uppercase;line-height:1}
.drow small{color:var(--mut);font-size:.82rem}
.drow .tagpos{font-size:.72rem;font-weight:800;letter-spacing:.08em;border-radius:8px;padding:4px 7px;background:var(--card3);color:var(--fg)}
.drow.gk .tagpos{background:var(--gold);color:var(--ink)}
.dlabel{font-size:.75rem;color:var(--dim);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.mref{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:6px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:10px}
.mref label{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:500;padding:4px 6px;border-radius:8px;cursor:pointer}
.mref label:hover{background:var(--card)}
.mref input{width:18px;height:18px;accent-color:var(--gold)}

/* Admin */
.adm{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:980px){.adm{grid-template-columns:250px minmax(0,1fr)}}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px;align-content:start}
@media (min-width:980px){.adm-nav{flex-direction:column;flex-wrap:nowrap;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}}
.adm-nav button{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;font-weight:600;font-size:.92rem;color:var(--mut)}
.adm-nav button[aria-current="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.adm-nav small{font-variant-numeric:tabular-nums;opacity:.75}
.status{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));margin-bottom:18px}
.status .card{padding:14px 16px;display:grid;gap:6px;align-content:start}
.dotok{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
.dotwarn{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:6px}
.alist{display:grid;gap:8px}
.aitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.aitem img,.aitem .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--card2)}
.aitem .ph{display:grid;place-items:center;color:var(--dim)}
.aitem .ph svg{width:20px;height:20px}
.aitem b{display:block;overflow-wrap:anywhere;line-height:1.2}
.aitem small{color:var(--mut);font-size:.82rem}
.aitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.fld{display:grid;gap:5px;align-content:start;min-width:0}
.fld-wide{grid-column:1/-1}
.fld label{font-weight:600;font-size:.92rem}
.fld .req{color:var(--gold)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld input[type=month],.fld input[type=url],.fld select,.fld textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:44px}
.fld input[type=color]{width:64px;height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);padding:4px}
.fld textarea{resize:vertical;line-height:1.5}
.fld .hint{color:var(--dim);font-size:.8rem}
.fld-check{display:flex;flex-wrap:wrap;align-items:center;gap:10px;grid-column:1/-1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.fld-check input{width:20px;height:20px;accent-color:var(--gold)}
.fld-check .hint{flex-basis:100%}
.media-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.media-in input[type=text]{flex:1 1 200px}
.media-prev{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--card2);border:1px solid var(--line)}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ev-ed{display:grid;gap:8px}
.ev-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr)) 44px;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px}
.ev-row select,.ev-row input{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px;min-height:40px;width:100%;min-width:0}
.ev-row:not([data-tipo="gol"]) .ev-ast{visibility:hidden}
.errs{background:var(--err-bg);border:1px solid #7a2630;color:#ffd2d2;border-radius:12px;padding:12px 14px;grid-column:1/-1}
.errs ul{margin:6px 0 0;padding-left:18px}
.form-acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;border-top:1px solid var(--line)}
@media (min-width:1000px){.form-acts{bottom:0}}
.hist{display:grid;gap:6px}
.hist div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.hist time{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:95;display:grid;gap:8px;width:min(460px,calc(100% - 32px))}
@media (min-width:1000px){.toasts{bottom:24px}}
.toast{background:var(--fg);color:var(--ink);border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{background:var(--err);color:#1a0505}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

      <button class="ibtn" type="button" data-act="menu" aria-label="Abrir menu" aria-expanded="false" id="menubtn"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

</header>

<script>
(() => {
'use strict';

/* ---------- Estado ---------- */
const COLS = ['times','jogadores','drafts','partidas','totais','campeoes','regrasFormato','regrasDisciplina','linhaDoTempo','noticias','videos','instagram','patrocinadores','galeria'];

const S = {

  live:{}, dbReady:false, meta:null, route:'inicio', param:'', editing:false, pending:false, historico:[],
  ui:{jogos:{mes:'todos',time:'',sit:''}, rank:{tab:'gols',mes:'todos',time:'',pos:''}, cmp:{a:'',b:''}, midia:{cat:''}, news:{cat:''}, jog:{pos:''}, draft:{mes:''}},
  adm:{sec:'partidas', edit:null, del:null, busy:false, msg:'', errs:[]},
  lb:null, searchQ:''
};

/* ---------- Utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const pad = n => String(n).padStart(2,'0');
const TODAY = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const fmtDate = s => { if(!s) return ''; const [y,m,d] = String(s).split('-'); return d ? `${d}/${m}/${y}` : s; };
const fmtDateLong = s => { if(!s) return ''; const dt = new Date(s+'T12:00:00'); return isNaN(dt) ? s : dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); };
const fmtStamp = s => { if(!s) return ''; const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
const mesLabel = m => { if(!m) return ''; const [y,mm] = String(m).split('-'); return (MESES[+mm-1]||mm)+' de '+y; };
const TBC = '<span class="tbc">A confirmar</span>';
const show = v => (v===''||v==null) ? TBC : esc(v);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const slug = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || uid();
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const ord = (a,b) => (a.ordem ?? 999) - (b.ordem ?? 999);
const D = () => S.data;
const byId = (col,id) => id ? (D()[col]||[]).find(x => x.id === id) : null;
const team = id => byId('times', id);
const player = id => byId('jogadores', id);
const pnm = p => p ? (p.apelido || p.nome) : '';
const tnm = (id, short) => { const t = team(id); return t ? (short ? (t.sigla||t.nome) : t.nome) : ''; };
const latestDraft = () => (D().drafts||[]).slice().sort((a,b) => (b.mes||'').localeCompare(a.mes||''))[0] || null;
function teamOf(pid){
  const dr = latestDraft();
  if(dr){ if(dr.goleiroAId === pid || (dr.jogadoresA||[]).includes(pid)) return dr.timeAId || ''; if(dr.goleiroBId === pid || (dr.jogadoresB||[]).includes(pid)) return dr.timeBId || ''; }
  const p = player(pid); return p && p.timeId || '';
}
const POS_AB = {'Goleiro':'GOL','Zagueiro':'ZAG','Meio-campo':'MC','Atacante':'ATA'};
const waLink = (num) => { let d = String(num||'').replace(/\D/g,''); if(!d) return ''; if(d.length <= 11) d = '55'+d; return 'https://wa.me/'+d; };
const igLink = h => { h = String(h||'').trim().replace(/^@/,''); if(!h) return ''; return /^https?:/.test(h) ? h : 'https://www.instagram.com/'+encodeURIComponent(h)+'/'; };
const safeUrl = u => { u = String(u||'').trim(); return /^https:\/\//i.test(u) ? u : ''; };
const media = u => { u = String(u||'').trim(); if(!u) return ''; if(/^https:\/\//i.test(u) || u.startsWith('/_blob/') || /^(img|video)\//.test(u) || /^[\w.-]+\.(png|jpe?g|webp|gif|mp4|webm)$/i.test(u)) return u; return ''; };
const shareUrl = token => { const base = safeUrl(D().config.siteUrl); return base ? base.replace(/#.*$/,'') + '#' + token : ''; };
const waShare = (text, token) => { const u = shareUrl(token) || safeUrl(D().config.instagramUrl); return 'https://wa.me/?text=' + encodeURIComponent(text + (u ? '\n' + u : '')); };

/* ---------- Ícones ---------- */
const IC = {
  home:'<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  chart:'<path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',
  news:'<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>',
  insta:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
  heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  ball:'<circle cx="12" cy="12" r="10"/><path d="m12 7 4.5 3.3-1.7 5.2H9.2l-1.7-5.2z"/><path d="M12 2v5M21.5 9.5l-5 .8M18 20l-3.2-4.5M6 20l3.2-4.5M2.5 9.5l5 .8"/>',
  crown:'<path d="m2 7 5 4 5-7 5 7 5-4-2 12H4z"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  scale:'<path d="M12 3v18M6 21h12M4 7h16M7 7l-3 7a4 3 0 0 0 6 0zM17 7l-3 7a4 3 0 0 0 6 0z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  flag:'<path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9 9l6 4M15 9l-6 4"/>',
  hourglass:'<path d="M5 22h14M5 2h14M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 9.5c.3 1.8 1.7 3.5 3.6 4.4l1.2-1 1.7.8"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  play:'<path d="m6 3 14 9-14 9z"/>',
  arrowR:'<path d="M5 12h14M12 5l7 7-7 7"/>',
  arrowL:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const ic = (n, cls='ico') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
const RULE_IC = {coroa:'crown',draft:'list',calendario:'calendar',trofeu:'trophy',empate:'scale',estrela:'star',ciclo:'refresh',campo:'ball',capitao:'flag',pagamento:'cash',ofensa:'msg',cera:'hourglass',relogio:'clock'};
const ruleIcon = k => {
  if(k==='amarelo') return '<span class="cardsym cs-y" aria-hidden="true"></span>';
  if(k==='vermelho') return '<span class="cardsym cs-r" aria-hidden="true"></span>';
  if(k==='goleiro-amarelo') return '<span style="display:flex;gap:3px;align-items:center">'+ic('shield')+'<span class="cardsym cs-y" style="width:12px;height:18px"></span></span>';
  if(k==='goleiro-vermelho') return '<span style="display:flex;gap:3px;align-items:center">'+ic('shield')+'<span class="cardsym cs-r" style="width:12px;height:18px"></span></span>';
  return ic(RULE_IC[k] || 'info');
};

/* ---------- Rotas ---------- */
const NAV = [
  ['inicio','Início','home'],['sobre','Sobre a Liga','info'],['competicao','Como funciona','book'],['jogos','Jogos e resultados','calendar'],
  ['times','Times e elencos','shield'],['draft','Draft do mês','list'],['ranking','Artilharia e assistências','chart'],['campeoes','Hall dos campeões','trophy'],
  ['midia','Mídia','video'],['noticias','Notícias','news'],['instagram','Instagram','insta'],['apoiadores','Nossos apoiadores','heart'],['local','Onde e quando jogamos','pin']
];
const TOPNAV = [['jogos','Jogos'],['draft','Draft'],['times','Times'],['ranking','Ranking'],['campeoes','Campeões'],['competicao','Regras'],['noticias','Notícias'],['midia','Mídia']];
const PARAM_ROUTES = ['jogo','time','jogador','noticia'];
function parseHash(){
  const h = decodeURIComponent((location.hash||'').replace(/^#/,''));
  for(const p of PARAM_ROUTES){ if(h.startsWith(p+'-')) return [p, h.slice(p.length+1)]; }
  const ok = NAV.map(n=>n[0]).concat(['admin']);
  return [ok.includes(h) ? h : 'inicio', ''];
}
function navGroup(r){ return ({jogo:'jogos',time:'times',jogador:'times',noticia:'noticias'})[r] || r; }

/* ---------- Partidas ---------- */
const matchKey = p => (p.mes||'0000-00')+'|'+String(p.rodada||0).padStart(3,'0')+'|'+(p.data||'')+'|'+(p.hora||'');
const hasScore = p => isNum(p.golsMandante) && isNum(p.golsVisitante);
function winnerId(p){
  if(p.situacao !== 'encerrado') return '';
  if(hasScore(p)){ if(p.golsMandante > p.golsVisitante) return p.mandanteId; if(p.golsVisitante > p.golsMandante) return p.visitanteId; return 'empate'; }
  return p.vencedorId || '';
}
function status(p){
  const t = TODAY();
  if(p.situacao === 'encerrado') return {k:'enc', l:'Encerrado'};
  if(p.situacao === 'adiado') return {k:'adi', l:'Adiado'};
  if(p.situacao === 'cancelado') return {k:'can', l:'Cancelado'};
  if(p.situacao === 'agendado'){ if(p.data && p.data < t) return {k:'agu', l:'Aguardando resultado'}; return {k:'age', l: p.data === t ? 'Hoje' : 'Agendado'}; }
  return {k:'agu', l:'A confirmar'};
}
const sortedMatches = () => D().partidas.slice().sort((a,b) => matchKey(a).localeCompare(matchKey(b)));
const upcoming = () => { const t = TODAY(); return D().partidas.filter(p => p.situacao === 'agendado' && (!p.data || p.data >= t)).sort((a,b) => (a.data||'9999').localeCompare(b.data||'9999') || matchKey(a).localeCompare(matchKey(b))); };
const finished = () => D().partidas.filter(p => p.situacao === 'encerrado').sort((a,b) => matchKey(b).localeCompare(matchKey(a)));
const matchTitle = p => (p.titulo || ('Rodada '+(p.rodada||''))) + (p.mes ? ' • ' + mesLabel(p.mes) : '');
function resultText(p){
  const w = winnerId(p);
  if(p.situacao !== 'encerrado') return '';
  if(w === 'empate') return 'Empate';
  if(w) return 'Vitória do ' + tnm(w, true);
  return 'Resultado a confirmar';
}
function months(){
  const s = new Set(); D().partidas.forEach(p => p.mes && s.add(p.mes)); D().campeoes.forEach(c => c.mes && s.add(c.mes)); if(D().config.totaisMes) s.add(D().config.totaisMes);
  return Array.from(s).sort().reverse();
}

/* ---------- Estatísticas ---------- */
function computeStats(f = {}){
  const mes = f.mes || 'todos';
  const m = new Map();
  const get = id => { if(!m.has(id)) m.set(id, {id, g:0, a:0, am:0, vm:0, jogos:new Set()}); return m.get(id); };
  const cfg = D().config;
  if(mes === 'todos' || mes === cfg.totaisMes){
    for(const t of D().totais){ if(!t.jogadorId) continue; const r = get(t.jogadorId); r.g += +t.gols||0; r.a += +t.assistencias||0; }
  }
  for(const p of D().partidas){
    if(p.situacao !== 'encerrado') continue;
    if(mes !== 'todos' && p.mes !== mes) continue;
    for(const e of (p.eventos||[])){
      if(e.tipo === 'gol'){
        if(p.incluidoNoTotalOficial) continue;
        if(e.jogadorId){ const r = get(e.jogadorId); r.g++; r.jogos.add(p.id); }
        if(e.assistenciaId){ const r = get(e.assistenciaId); r.a++; r.jogos.add(p.id); }
      } else if(e.tipo === 'amarelo' && e.jogadorId){ get(e.jogadorId).am++; }
      else if(e.tipo === 'vermelho' && e.jogadorId){ get(e.jogadorId).vm++; }
    }
  }
  let rows = Array.from(m.values()).filter(r => player(r.id));
  if(f.time) rows = rows.filter(r => teamOf(r.id) === f.time);
  if(f.pos) rows = rows.filter(r => player(r.id).posicao === f.pos);
  rows.forEach(r => { r.ga = r.g + r.a; r.cart = r.am + r.vm; });
  return rows;
}
function rankBy(rows, key){
  const list = rows.filter(r => r[key] > 0).map(r => ({...r, v:r[key]}));
  list.sort((x,y) => y.v - x.v || pnm(player(x.id)).localeCompare(pnm(player(y.id)), 'pt-BR'));
  list.forEach(r => { r.pos = 1 + list.filter(o => o.v > r.v).length; r.tie = list.filter(o => o.v === r.v).length > 1; });
  return list;
}
function playerStats(id){ return computeStats().find(r => r.id === id) || {id, g:0, a:0, am:0, vm:0, ga:0, cart:0, jogos:new Set()}; }
function teamTable(mes){
  const rows = D().times.map(t => ({id:t.id, j:0, v:0, d:0, e:0, gp:0, gc:0, jp:0}));
  const g = id => rows.find(r => r.id === id);
  for(const p of D().partidas){
    if(p.situacao !== 'encerrado') continue;
    if(mes && mes !== 'todos' && p.mes !== mes) continue;
    const A = g(p.mandanteId), B = g(p.visitanteId); if(!A || !B) continue;
    A.j++; B.j++;
    const w = winnerId(p);
    if(w === 'empate'){ A.e++; B.e++; } else if(w === A.id){ A.v++; B.d++; } else if(w === B.id){ B.v++; A.d++; }
    if(hasScore(p)){ A.gp += p.golsMandante; A.gc += p.golsVisitante; B.gp += p.golsVisitante; B.gc += p.golsMandante; A.jp++; B.jp++; }
  }
  return rows;
}

function rankList(list, unit, limit){

  const tab = TABS.find(t => t[0] === u.tab) || TABS[0];
  const list = rankBy(rows, tab[2]);
  const leaders = list.filter(r => r.pos === 1);

function compareHtml(a, b){
  const A = player(a), B = player(b); if(!A || !B) return '<p class="muted">Escolha dois jogadores.</p>';
  const sa = playerStats(a), sb = playerStats(b);
  const rows = [['Gols','g'],['Assistências','a'],['Participações','ga']];
  return `<div class="cmp-heads"><a class="cmp-head" href="#jogador-${esc(A.id)}" style="color:inherit;text-decoration:none"><img src="${esc(photo(A))}" alt=""><b>${esc(pnm(A))}</b></a><a class="cmp-head" href="#jogador-${esc(B.id)}" style="color:inherit;text-decoration:none"><img src="${esc(photo(B))}" alt=""><b>${esc(pnm(B))}</b></a></div>
  <div class="cmp">${rows.map(([l,k]) => { const mx = Math.max(sa[k], sb[k], 1);
    return `<div class="cmp-row"><span class="l">${sa[k]}</span><div class="cmp-bar left"><i style="width:${sa[k]/mx*100}%;background:var(--blue)"></i></div><span class="lab">${l}</span><div class="cmp-bar"><i style="width:${sb[k]/mx*100}%;background:var(--red)"></i></div><span class="r">${sb[k]}</span></div>`; }).join('')}</div>`;
}

function evolutionHtml(){
  const cfg = D().config, pts = [];
  const acc = new Map();
  if(D().totais.length){ D().totais.forEach(t => acc.set(t.jogadorId, (acc.get(t.jogadorId)||0) + (+t.gols||0))); pts.push({label: cfg.totaisRotulo || 'Totais oficiais', vals: new Map(acc)}); }
  sortedMatches().filter(p => p.situacao === 'encerrado' && !p.incluidoNoTotalOficial && (p.eventos||[]).some(e => e.tipo === 'gol')).forEach(p => {
    p.eventos.forEach(e => { if(e.tipo === 'gol' && e.jogadorId) acc.set(e.jogadorId, (acc.get(e.jogadorId)||0) + 1); });
    pts.push({label: p.titulo || 'Partida', vals: new Map(acc)});
  });
  if(pts.length < 2) return emptyBox('chart','Evolução a partir da próxima partida', `Hoje existe um único marco (${esc(pts[0]?.label || 'sem dados')}). O gráfico ganha linhas quando os gols das próximas partidas forem lançados no painel.`);
  const lastVals = pts[pts.length-1].vals;
  const top = Array.from(lastVals.entries()).filter(([id]) => player(id)).sort((a,b) => b[1]-a[1]).slice(0,5).map(x => x[0]);
  const W = 560, H = 260, L = 34, R = 16, T = 14, B = 34;
  const max = Math.max(1, ...top.map(id => lastVals.get(id)));
  const nice = Math.ceil(max/5)*5;
  const x = i => L + (W-L-R) * (pts.length === 1 ? 0 : i/(pts.length-1));
  const y = v => T + (H-T-B) * (1 - v/nice);
  const COL = ['#f2b632','#79a3ff','#ff7d87','#3fcf8e','#c39bff'];
  const grid = [0, nice/5*1, nice/5*2, nice/5*3, nice/5*4, nice].map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#21314f" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" fill="#7387ad" font-size="11" text-anchor="end">${Math.round(v)}</text>`).join('');
  const xl = pts.map((p,i) => `<text x="${x(i)}" y="${H-12}" fill="#a3b3d1" font-size="11" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(p.label)}</text>`).join('');
  const lines = top.map((id,k) => { const d = pts.map((p,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(p.vals.get(id)||0).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${COL[k]}" stroke-width="2.5"/>` + pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.vals.get(id)||0)}" r="${i===pts.length-1?4.5:3}" fill="${COL[k]}"/>`).join(''); }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de gols">${grid}${xl}${lines}</svg></div><div class="legend">${top.map((id,k) => `<span><i style="background:${COL[k]}"></i>${esc(pnm(player(id)))}</span>`).join('')}</div>`;
}

function validatePartida(o){
  const err = [], t = TODAY();
  if(o.mandanteId && o.mandanteId === o.visitanteId) err.push('Escolha dois times diferentes.');
  if(o.situacao === 'agendado' && o.data && o.data < t) err.push('A data já passou. Um jogo que já aconteceu deve ficar como "Encerrado" ou "Adiado".');
  if(o.situacao === 'encerrado' && o.data && o.data > t) err.push('Um jogo com data futura não pode estar encerrado.');
  const a = o.golsMandante, b = o.golsVisitante;
  if((a == null) !== (b == null)) err.push('Informe o placar dos dois times ou deixe os dois em branco.');
  if(o.situacao !== 'encerrado' && (a != null || b != null || o.eventos.length || o.vencedorId)) err.push('Placar, vencedor e lançamentos só podem ser registrados em jogos encerrados.');
  if(a != null && b != null && o.vencedorId){ const w = a > b ? o.mandanteId : b > a ? o.visitanteId : 'empate'; if(w !== o.vencedorId) err.push('O vencedor escolhido não confere com o placar. Deixe "Calcular pelo placar".'); }
  if(o.vencedorId && o.vencedorId !== o.mandanteId && o.vencedorId !== o.visitanteId) err.push('O vencedor precisa ser um dos dois times da partida.');
  const seen = new Set();
  o.eventos.forEach((e,i) => {
    const n = i+1;
    if(!e.jogadorId) err.push(`Lançamento ${n}: escolha o jogador.`);
    if(e.timeId !== o.mandanteId && e.timeId !== o.visitanteId) err.push(`Lançamento ${n}: escolha um dos times da partida.`);
    if(e.assistenciaId && e.assistenciaId === e.jogadorId) err.push(`Lançamento ${n}: o autor do gol não pode ser o autor da assistência.`);
    if(e.minuto !== '' && e.minuto != null){ const key = [e.tipo,e.jogadorId,e.minuto].join('|'); if(seen.has(key)) err.push(`Lançamento ${n} está repetido (mesmo tipo, jogador e minuto).`); seen.add(key); }
  });
  if(a != null){ const ga = o.eventos.filter(e => e.tipo==='gol' && e.timeId===o.mandanteId).length, gb = o.eventos.filter(e => e.tipo==='gol' && e.timeId===o.visitanteId).length;
    if(ga > a) err.push(`Há ${ga} gols lançados para o Time A, mas o placar indica ${a}.`); if(gb > b) err.push(`Há ${gb} gols lançados para o Time B, mas o placar indica ${b}.`); }
  return err;
}

function validateDraft(o){
  const err = [];
  if(o.timeAId && o.timeAId === o.timeBId) err.push('Escolha dois times diferentes.');
  const A = [o.goleiroAId, ...o.jogadoresA].filter(Boolean), B = [o.goleiroBId, ...o.jogadoresB].filter(Boolean);
  const both = A.filter(id => B.includes(id)); if(both.length) err.push('Jogador nos dois times: ' + both.map(id => pnm(player(id))).join(', ') + '.');
  if(o.goleiroAId && o.jogadoresA.includes(o.goleiroAId)) err.push('O goleiro do Time A também está marcado como jogador de linha.');
  if(o.goleiroBId && o.jogadoresB.includes(o.goleiroBId)) err.push('O goleiro do Time B também está marcado como jogador de linha.');
  if(o.capitaoAId && !A.includes(o.capitaoAId)) err.push('O capitão do Time A precisa estar no Time A.');
  if(o.capitaoBId && !B.includes(o.capitaoBId)) err.push('O capitão do Time B precisa estar no Time B.');
  return err;
}

  </div>${S.adm.msg?`<div class="note" style="margin-bottom:16px">${ic('info')}<span>${S.adm.msg}</span></div>`:''}`;
  if(!S.dbReady){
    return head + `<section class="band" style="padding-top:12px"><div class="wrap">${status}<div class="card" style="display:grid;gap:12px;justify-items:start"><h3>Importar dados oficiais</h3><p class="muted">Copia para o banco os dados já publicados no site (times, jogadores, jogos, totais, campeão, regras, notícias, mídia e apoiadores). Depois disso, todas as edições passam a ser salvas no banco.</p><button type="button" class="btn btn-gold" data-act="adm-import" ${S.adm.busy?'disabled':''}>${ic('upload')} Importar dados oficiais</button></div></div></section>`;
  }

  let body = '';

function fieldHtml(f, v, isNew){

    case 'image': case 'video': {

    case 'multiref': { const sel = new Set(v || []); return `<div class="fld fld-wide"><span style="font-weight:600">${esc(f.l)}</span><div class="mref" role="group" aria-label="${esc(f.l)}">${refOpts(f.ref).map(([k,l]) => `<label><input type="checkbox" name="${f.k}" value="${esc(k)}" ${sel.has(k)?'checked':''}>${esc(l)}</label>`).join('')}</div>${hint}</div>`; }

function collect(sec, form){
  const sc = SCHEMA[sec], o = {}, errs = [];
  for(const f of sc.fields){
    const el = form.elements[f.k];
    if(f.t === 'eventos'){
      o.eventos = $$('.ev-row', form).map(r => ({id:r.dataset.eid, tipo:$('.ev-tipo',r).value, timeId:$('.ev-time',r).value, jogadorId:$('.ev-jog',r).value, assistenciaId:$('.ev-tipo',r).value==='gol' ? $('.ev-ast',r).value : '', minuto: $('.ev-min',r).value === '' ? '' : Math.max(0, parseInt($('.ev-min',r).value,10)||0)}));
      continue;
    }
    if(f.t === 'multiref'){ o[f.k] = $$(`input[name="${f.k}"]:checked`, form).map(i => i.value); continue; }
    if(!el) continue;
    if(f.t === 'check'){ o[f.k] = !!el.checked; continue; }
    let v = String(el.value ?? '').trim();
    if(f.t === 'number'){
      if(v === ''){ if(f.req) errs.push(`Preencha "${f.l}".`); o[f.k] = f.nullable ? null : (f.req ? null : null); if(!f.nullable && !f.req) o[f.k] = null; continue; }
      const n = Number(v); if(!Number.isInteger(n) || (f.min!=null && n < f.min)){ errs.push(`"${f.l}" precisa ser um número inteiro${f.min!=null?' a partir de '+f.min:''}.`); continue; }
      o[f.k] = n; continue;
    }
    if(f.t === 'links'){ o[f.k] = v.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const i = s.lastIndexOf('|'); const url = (i>=0?s.slice(i+1):s).trim(), titulo = i>=0?s.slice(0,i).trim():''; if(!/^https:\/\//i.test(url)) errs.push(`Link inválido em "${f.l}": ${url}`); return {tipo:/instagram/i.test(url)?'instagram':'link', titulo, url}; }); continue; }
    if(f.req && !v) errs.push(`Preencha "${f.l}".`);
    if(v && f.t === 'url' && !/^https:\/\/[^\s]+\.[^\s]+/i.test(v)) errs.push(`"${f.l}" precisa começar com https://`);
    if(v && f.t === 'month' && !/^\d{4}-(0[1-9]|1[0-2])$/.test(v)) errs.push(`"${f.l}" precisa estar no formato AAAA-MM.`);
    if(v && f.t === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(v)) errs.push(`"${f.l}" está com data inválida.`);
    if(v && (f.t === 'image' || f.t === 'video') && !media(v)) errs.push(`"${f.l}": use um arquivo enviado, um caminho img/ ou video/, ou um link https.`);
    if(v.length > 20000) errs.push(`"${f.l}" está longo demais.`);
    o[f.k] = v;
  }
  if(sc.validate) errs.push(...sc.validate(o, form.dataset.new === '1'));
  return {o, errs};
}
function newId(sec, o){ const base = slug(SCHEMA[sec].idFrom(o)); let id = base, n = 2; while(byId(sec, id)) id = base + '-' + (n++); return id; }

async function logH(acao, colecao, docId, titulo){

async function touchMeta(extra = {}){ try{ await S.db.doc('site/meta').update({alteradoEm:new Date().toISOString(), ...extra}); }catch(e){ console.warn('meta', e); } }
function dbErr(e){
  const c = e && e.code;
  if(c === 'invalid_argument') return 'O banco recusou a gravação. Verifique se você está logado com a conta de administrador.';
  if(c === 'quota_exceeded') return 'O limite de armazenamento foi atingido. Exclua itens antigos e tente de novo.';
  if(c === 'resource_exhausted') return 'Muitas gravações seguidas. Aguarde alguns segundos e tente de novo.';
  if(c === 'revoked') return 'Seu acesso foi alterado. Recarregue a página.';
  return 'Não foi possível salvar agora. Tente de novo em instantes.';
}
async function submitForm(form){
  const sec = form.dataset.sec, isNew = form.dataset.new === '1';
  const {o, errs} = collect(sec, form);
  S.adm.errs = errs;
  if(errs.length){ rerender(true, true); $('.errs')?.scrollIntoView({block:'center'}); return; }
  S.adm.busy = true;
  try{
    if(sec === 'config'){
      await S.db.doc('site/config').set({...D().config, ...o});
      await logH('editou','config','config','Configurações gerais');
    } else {
      const sc = SCHEMA[sec];
      const id = isNew ? (sec === 'totais' ? o.jogadorId : newId(sec, o)) : form.dataset.id;
      const prev = isNew ? {} : (byId(sec, id) || {});
      const body = {...prev, ...o}; delete body.id;
      if(sec === 'totais' && !isNew) body.jogadorId = prev.jogadorId;
      await S.db.collection(sec).doc(id).set(body);
      await logH(isNew?'criou':'editou', sec, id, sc.title({...body, id}));
    }
    await touchMeta();
    S.adm.edit = null; S.adm.errs = []; S.editing = false;
    toast('Salvo. Para visitantes sem login, use "Atualizar versão pública".');
  }catch(e){ console.error(e); toast(dbErr(e), true); }
  S.adm.busy = false; rerender(true);
}

async function importAll(){
  if(!S.db || S.adm.busy) return;
  S.adm.busy = true; S.adm.msg = 'Importando…'; rerender(true);
  try{
    const src = S.jsonData || D();
    let n = 0;
    for(const c of COLS){ for(const it of src[c]){ const body = {...it}; delete body.id; await S.db.collection(c).doc(it.id).set(body); n++; if(n % 10 === 0){ S.adm.msg = `Importando… ${n} itens`; renderStatusOnly(); } } }
    await S.db.doc('site/config').set({...src.config});
    const now = new Date().toISOString();
    await S.db.doc('site/meta').set({inicializado:true, criadoEm:now, alteradoEm:now, publicadoEm:src.atualizadoEm || now, versaoPublica:src.versao || 1});
    await logH('importou','todos','-','Importação dos dados oficiais ('+n+' itens)');
    S.adm.msg = `Importação concluída: ${n} itens.`;
  }catch(e){ console.error(e); S.adm.msg = 'A importação parou: ' + dbErr(e) + ' Clique de novo para continuar; itens já gravados são apenas regravados.'; }
  S.adm.busy = false; rerender(true);
}

function exportData(){
  const d = D(), out = {versao:(S.meta?.versaoPublica||1)+1, atualizadoEm:new Date().toISOString(), config:{...d.config}};
  for(const c of COLS) out[c] = d[c].map(x => ({...x}));
  return out;
}
async function publishPublic(){
  if(S.adm.busy) return;
  if(!S.artifact){ S.adm.msg = 'A publicação automática não está disponível nesta visualização. Peça ao Claude: "atualize a versão pública da Liga Neo SJ".'; rerender(true); return; }
  S.adm.busy = true; S.adm.msg = 'Publicando a versão pública…'; rerender(true);
  try{
    const data = exportData();
    await S.artifact.publish({'dados.json': {content: JSON.stringify(data, null, 1), contentType:'application/json'}});
    const now = new Date().toISOString();
    await S.db.doc('site/meta').update({publicadoEm:now, versaoPublica:data.versao});
    await logH('publicou','site','dados.json','Versão pública '+data.versao);
    S.adm.msg = 'Versão pública atualizada. Visitantes sem login já veem os dados novos.';
  }catch(e){
    const c = e && e.code;
    if(c === 'capability_disabled' || c === 'not_granted' || c === 'capability_removed' || c === 'consent_required') S.adm.msg = 'A publicação automática não está disponível aqui (por exemplo, quando o site está compartilhado por link público). Os dados estão salvos no banco. Para atualizar a versão pública, peça ao Claude: "atualize a versão pública da Liga Neo SJ".';
    else if(c === 'not_writer') S.adm.msg = 'Sua conta pode editar os dados, mas não pode publicar versões do site. Peça ao dono do site.';
    else if(c === 'conflict') S.adm.msg = 'Outra versão foi publicada ao mesmo tempo. A página vai recarregar com a versão mais nova.';
    else if(c === 'rate_limited') S.adm.msg = 'Muitas publicações seguidas. Aguarde um minuto e tente de novo.';
    else S.adm.msg = 'Não foi possível publicar agora. Tente de novo em instantes.';
  }
  S.adm.busy = false; rerender(true);
}

    ['Notícias', D().noticias.filter(x => hit(x.titulo,x.texto,x.categoria)).map(x => [`#noticia-${x.id}`, media(x.imagem), x.titulo, fmtDate(x.data)])],
    ['Apoiadores', D().patrocinadores.filter(x => hit(x.nome,x.descricao)).map(x => ['#apoiadores', media(x.logo), x.nome, x.descricao||'Apoiador'])],
    ['Regras', D().regrasFormato.concat(D().regrasDisciplina).filter(x => hit(x.titulo,x.texto)).map(x => ['#competicao', '', x.titulo, 'Como funciona'])]
  ].filter(g => g[1].length);
  box.innerHTML = groups.length ? groups.map(([k, items]) => `<div class="sres-k">${k}</div>` + items.slice(0,8).map(([h,img,t,s]) => `<a class="sres" href="${esc(h)}">${img?`<img src="${esc(img)}" alt="">`:`<span class="ibtn" aria-hidden="true">${ic('arrowR')}</span>`}<span><b>${esc(t)}</b><small>${esc(s)}</small></span></a>`).join('')).join('') : '<p class="muted small" style="padding:10px">Nada encontrado.</p>';
}
function openLb(src, cap){ const l = $('#lb'); l.innerHTML = `<button type="button" class="ibtn" data-act="close-lb" aria-label="Fechar imagem">${ic('x')}</button><figure style="margin:0"><img src="${esc(src)}" alt="${esc(cap)}"><figcaption>${esc(cap)}</figcaption></figure>`; l.hidden = false; $('.ibtn', l).focus(); }
function closeLb(){ const l = $('#lb'); if(!l.hidden) l.hidden = true; }
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; $('#toasts').append(t); setTimeout(() => t.remove(), err ? 7000 : 4000); }

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(e.target.id === 'drawer') return closeDrawer();
  if(e.target.id === 'search') return closeSearch();
  if(e.target.id === 'lb') return closeLb();
  if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch(a){
    case 'menu': openDrawer(); break;
    case 'close-menu': closeDrawer(); break;
    case 'search': openSearch(); break;
    case 'close-search': closeSearch(); break;
    case 'lb': openLb(b.dataset.src, b.dataset.cap); break;
    case 'close-lb': closeLb(); break;
    case 'rank-tab': S.ui.rank.tab = v; rerender(true); break;
    case 'chip': { const [g,k] = b.dataset.f.split('.'); S.ui[g][k] = v; rerender(true); break; }
    case 'copy': navigator.clipboard?.writeText(v).then(() => toast('Link copiado.'), () => toast('Não foi possível copiar. Link: ' + v, true)); break;
    case 'adm-sec': S.adm.sec = v; S.adm.edit = null; S.adm.del = null; S.adm.errs = []; S.editing = false; rerender(true); if(S.pending){ S.pending = false; } break;
    case 'adm-new': S.adm.edit = '__new'; S.adm.errs = []; rerender(true); $('#admform')?.scrollIntoView({block:'start'}); break;
    case 'adm-edit': S.adm.edit = v; S.adm.errs = []; rerender(true); $('#admform')?.scrollIntoView({block:'start'}); break;
    case 'adm-cancel': S.adm.edit = null; S.adm.errs = []; S.editing = false; rerender(true); break;
    case 'adm-del': S.adm.del = v; rerender(true); break;
    case 'adm-del-no': S.adm.del = null; rerender(true); break;
    case 'adm-del-ok': deleteItem(S.adm.sec, v); break;
    case 'adm-import': importAll(); break;
    case 'adm-publish': publishPublic(); break;
    case 'ev-add': $('#ev-list').insertAdjacentHTML('beforeend', evRow({timeId: $('#f_mandanteId')?.value || ''})); break;
    case 'ev-del': b.closest('.ev-row').remove(); break;
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if(t.dataset.f){ const [g,k] = t.dataset.f.split('.'); S.ui[g][k] = t.value; rerender(true); return; }
  if(t.classList.contains('ev-tipo')){ t.closest('.ev-row').dataset.tipo = t.value; return; }
  if(t.dataset.up){
    const file = t.files && t.files[0]; if(!file || !S.assets) return;
    if(file.size > 20*1024*1024){ toast('Arquivo maior que 20 MB. Reduza o tamanho e envie de novo.', true); t.value=''; return; }
    toast('Enviando arquivo…');
    try{ const r = await S.assets.upload(file, file.type ? undefined : {type: t.dataset.kind==='image'?'image/jpeg':'video/mp4'}); const inp = document.getElementById('f_'+t.dataset.up); inp.value = '/_blob/' + r.id; const pv = document.getElementById('f_'+t.dataset.up+'_prev'); if(pv){ pv.src = r.url; pv.hidden = false; } toast('Arquivo enviado. Clique em Salvar para guardar.'); }
    catch(err){ const c = err && err.code; toast(c==='too_large'?'Arquivo grande demais (limite de 20 MB).':c==='unsupported_type'?'Formato não aceito. Use JPG, PNG, WEBP ou MP4.':c==='quota_or_state'?'O espaço de arquivos está cheio.':'Não foi possível enviar o arquivo agora.', true); }
    t.value = '';
  }
});
document.addEventListener('input', e => { if(e.target.id === 'q') doSearch(e.target.value); });
document.addEventListener('submit', e => { if(e.target.id === 'admform'){ e.preventDefault(); if(!S.adm.busy) submitForm(e.target); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeDrawer(); closeSearch(); closeLb(); } });
$('#skip').addEventListener('click', () => { const m = $('#conteudo'); m.focus(); m.scrollIntoView(); });
window.addEventListener('hashchange', route);

/* ---------- Dados e capacidades ---------- */
function normalize(raw){
  const d = {config:{...DEFAULT_CFG, ...(raw && raw.config || {})}, atualizadoEm:(raw && raw.atualizadoEm) || '', versao:(raw && raw.versao) || 1};
  for(const c of COLS) d[c] = Array.isArray(raw && raw[c]) ? raw[c].map(x => ({...x})) : [];
  d.partidas.forEach(p => { if(!Array.isArray(p.eventos)) p.eventos = []; if(!Array.isArray(p.midia)) p.midia = []; });
  return d;
}
function onLive(){
  const site = S.live.site; if(!site) return;
  S.meta = site.meta || null;
  if(!S.meta || !S.meta.inicializado){ S.dbReady = false; scheduleRender(); return; }
  if(COLS.some(c => !S.live[c])) return;
  const raw = {config:site.config || {}, atualizadoEm:S.meta.alteradoEm || ''};
  COLS.forEach(c => raw[c] = S.live[c]);
  S.data = normalize(raw); S.dbReady = true; S.source = 'db';
  scheduleRender();
}
function subscribeAll(){
  const db = S.db;
  const fail = e => { console.warn('db', e && e.code); };
  db.collection('site').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = JSON.parse(JSON.stringify(d.data()))); S.live.site = o; onLive(); }, fail);
  COLS.forEach(c => db.collection(c).onSnapshot(snap => { S.live[c] = snap.docs.map(d => ({...JSON.parse(JSON.stringify(d.data())), id:d.id})); onLive(); }, fail));
  if(S.isAdmin) db.collection('historico').orderBy('quando','desc').limit(150).onSnapshot(snap => { S.historico = snap.docs.map(d => d.data()); if(S.route === 'admin' && S.adm.sec === 'historico') scheduleRender(); }, fail);
}
async function initCaps(){
  if(!window.claude || typeof window.claude.use !== 'function'){ S.adminChecked = true; if(S.route === 'admin') rerender(true); return; }
  try{
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    S.db = db; S.user = user;
    if(user){ try{ S.isAdmin = await user.canEdit(); }catch(e){ S.isAdmin = false; } }
    if(S.isAdmin){ const [as, ar] = await Promise.all([window.claude.use('assets'), window.claude.use('artifact')]); S.assets = as; S.artifact = ar; }
    if(db) subscribeAll();
  }catch(e){ console.warn(e); }
  S.adminChecked = true;
  if(S.route === 'admin') rerender(true);
}
async function boot(){
  try{ const r = await fetch('dados.json', {cache:'no-store'}); if(!r.ok) throw new Error(r.status); const raw = await r.json(); S.data = normalize(raw); S.jsonData = normalize(raw); }
  catch(e){ console.error(e); S.data = normalize({}); S.jsonData = S.data; toast('Não foi possível carregar os dados da liga. Recarregue a página.', true); }
  route();
  initCaps();
  loadIgLive();
}
boot();
})();
</script>
