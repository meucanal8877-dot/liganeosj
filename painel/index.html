<style>
:root{--bg:#070b16;--bg2:#0b1222;--card:#0f1729;--card2:#16203a;--line:#22304f;--line2:#33456f;--fg:#eef2ff;--mut:#93a0c2;--blue:#2f6dff;--blue2:#1b48c2;--red:#e5303f;--red2:#a51d2a;--gold:#f5b301;--green:#22c55e;--r:14px;--r2:20px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;overscroll-behavior-y:contain}
a{color:#8fb0ff}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-weight:800;letter-spacing:.01em}
h1{font-size:1.5rem;text-transform:uppercase}h2{font-size:1.15rem;text-transform:uppercase}h3{font-size:1rem}
.muted{color:var(--mut)}.small{font-size:.85rem}.tiny{font-size:.75rem}.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:rgba(7,11,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top img{width:30px;height:36px;object-fit:contain}
.top b{font-size:1rem;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.top .sub{font-size:.7rem;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:5px 10px;background:none;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.w{background:var(--gold)}.dot.e{background:var(--red)}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(9,14,28,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
.nav a{display:grid;justify-items:center;gap:2px;padding:6px 2px;color:var(--mut);text-decoration:none;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:12px}
.nav a.on{color:var(--fg);background:var(--card2)}
.nav svg{width:22px;height:22px}
.ico{width:18px;height:18px;flex:none;vertical-align:-3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.sec{display:grid;gap:12px;margin-bottom:22px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:12px;padding:10px 14px;font-weight:800;font-size:.86rem;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-decoration:none;min-height:42px}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1300}
.btn.blue{background:var(--blue);border-color:var(--blue)}.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:none}.btn.sm{min-height:34px;padding:6px 10px;font-size:.74rem;border-radius:10px}.btn.full{width:100%}
.btn.danger{border-color:#6b2430;color:#ff9aa5;background:#2a0f16}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line2);background:none;border-radius:99px;padding:7px 12px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:grid;gap:5px}.field label{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;outline:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:12px}

.av{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--card2);flex:none}
.av.lg{width:64px;height:64px;border-radius:16px}.av.sm{width:32px;height:32px;border-radius:9px}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px 8px 8px;cursor:pointer;color:inherit;text-decoration:none;width:100%;text-align:left}
.prow .t{min-width:0;flex:1}.prow b{display:block;text-transform:uppercase;line-height:1.1}.prow small{color:var(--mut);font-size:.78rem}
.badge{display:inline-block;border-radius:99px;padding:3px 9px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--line);color:var(--fg);white-space:nowrap}
.b-disp{background:#123a24;color:#7ef0a8}.b-sel{background:#13306b;color:#a9c4ff}.b-res{background:#3d300a;color:#ffd667}.b-ind{background:#3a1218;color:#ff9aa5}.b-dia{background:#3b2a52;color:#d7b8ff}
.tA{--tc:var(--blue)}.tB{--tc:var(--red)}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}

.crest{width:44px;height:48px;object-fit:contain}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .tm{display:grid;justify-items:center;gap:6px}.score .tm b{font-size:.8rem;text-transform:uppercase;line-height:1.1}
.score .pl{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;display:flex;gap:10px;align-items:center}

.mcard{display:grid;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:14px;cursor:pointer;color:inherit;text-decoration:none}
.mcard .score .pl{font-size:1.9rem}.mcard .crest{width:34px;height:38px}
.live{color:#ff6b78;font-weight:900;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#ff3b4e;animation:pul 1s infinite}
@keyframes pul{50%{opacity:.25}}
.clock{font-size:4.2rem;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;line-height:1;letter-spacing:.02em}
.clock.over{color:var(--gold);animation:pul 1s infinite}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{border:0;border-radius:18px;padding:18px 10px;font-weight:900;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;color:#fff;cursor:pointer;display:grid;gap:4px;justify-items:center}
.bigbtn.A{background:linear-gradient(180deg,var(--blue),var(--blue2))}.bigbtn.B{background:linear-gradient(180deg,var(--red),var(--red2))}
.bigbtn small{font-size:.7rem;opacity:.85;font-weight:700}
.fouls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foul{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:14px;padding:8px 10px}
.foul b{font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1}
.foul .btn{min-width:42px}
.tl{display:grid;gap:6px}
.ev{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:8px 10px}
.ev .min{font-variant-numeric:tabular-nums;font-weight:800;color:var(--mut);min-width:48px;font-size:.82rem}
.ev .t{flex:1;min-width:0}.ev b{display:block}.ev small{color:var(--mut)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(2,4,10,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));display:grid;gap:14px}

.mx{position:sticky;top:-8px;justify-self:end;margin:-6px -4px -40px 0;width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--fg);font-size:1.4rem;line-height:1;cursor:pointer;z-index:3}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pk{display:grid;justify-items:center;gap:5px;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:8px 4px;cursor:pointer;text-align:center;color:inherit}
.pk img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--card)}
.pk b{font-size:.72rem;text-transform:uppercase;line-height:1.1;word-break:break-word}
.pk.on{border-color:var(--gold);background:#2a2208}
.pk.alt{border-style:dashed}
.pk .ph{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--card);font-weight:900;font-size:1.2rem;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);font-weight:800;border-radius:12px;padding:10px 16px;font-size:.88rem;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{background:#ff9aa5;color:#2a0006}
.banner{border-radius:14px;padding:10px 14px;font-size:.85rem;background:#2d230a;border:1px solid #6b5313;color:#ffe08a;display:flex;gap:10px;align-items:flex-start}
.banner.e{background:#2a0f16;border-color:#6b2430;color:#ffb3bb}
.draft-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcol{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:16px;padding:10px;display:grid;gap:6px;align-content:start}
.dcol h3{font-size:.85rem;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:6px}
.dp{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:5px 6px}
.dp .t{flex:1;min-width:0;font-size:.78rem;font-weight:800;text-transform:uppercase;line-height:1.1}
.dp .t small{display:block;font-weight:600;text-transform:none;color:var(--mut);font-size:.68rem}
.x{border:0;background:none;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:2px 6px;line-height:1}
.turn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;background:var(--tc);color:#fff}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pc{position:relative;display:grid;justify-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;cursor:pointer;text-align:center;color:inherit}
.pc img,.pc .ph{width:58px;height:58px;border-radius:14px;object-fit:cover;background:var(--card)}
.pc .ph{display:grid;place-items:center;font-weight:900;color:var(--mut)}
.pc b{font-size:.74rem;text-transform:uppercase;line-height:1.1}
.pc .more{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--mut);cursor:pointer;font-weight:900;line-height:1}
.pitch-wrap{display:grid;gap:10px}
.pitch{position:relative;width:100%;max-width:min(440px,42vh);margin:0 auto;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(180deg,#1f7a3a 0 10%,#1b6e34 10% 20%);border:3px solid rgba(255,255,255,.55);touch-action:none}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.55)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .area{position:absolute;left:28%;right:28%;height:13%;border:2px solid rgba(255,255,255,.55)}
.pitch .area.b{bottom:-2px;border-bottom:0}.pitch .area.t{top:-2px;border-top:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:23%;display:grid;justify-items:center;gap:3px;z-index:2;cursor:pointer;touch-action:none}
.slot .c{width:58px;height:58px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);display:grid;place-items:center;background:rgba(0,0,0,.18);overflow:hidden;color:#fff;font-weight:900;font-size:.7rem}
.slot.f .c{border:3px solid #fff;background:var(--tc)}
.slot .c img{width:100%;height:100%;object-fit:cover}
.slot .n{font-size:.66rem;font-weight:900;text-transform:uppercase;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 6px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.slot.sel .c,.chipP.sel{outline:3px solid var(--gold);outline-offset:2px}
.slot.hov .c{border-color:var(--gold);background:rgba(245,179,1,.3)}
.bench{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:0 auto;width:100%}
.bench .slot{position:relative;transform:none;width:auto;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px;grid-template-columns:auto 1fr;justify-items:start;align-items:center;gap:8px;left:auto;top:auto}
.bench .slot .c{width:44px;height:44px}
.bench .slot .n{background:none;font-size:.72rem;max-width:none}
.chipsP{display:flex;flex-wrap:wrap;gap:6px}
.chipP{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;font-size:.74rem;font-weight:800;text-transform:uppercase;cursor:grab;touch-action:none;user-select:none}
.chipP img,.chipP .ph{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--card)}
.slot img,.chipP img,.slot .c,.chipP{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}.slot img,.chipP img{pointer-events:none}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%);opacity:.9}
.rk{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px}
.rk .pos{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:var(--card);flex:none}
.rk .pos.p1{background:var(--gold);color:#1a1300}
.rk .v{margin-left:auto;font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.rk .t{min-width:0}.rk b{display:block;text-transform:uppercase;line-height:1.1}.rk small{color:var(--mut);font-size:.74rem}
.series{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.series .w{font-size:2.4rem;font-weight:900}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--tc)}.dots i.on{background:var(--tc)}
.champ{background:linear-gradient(135deg,#3a2a00,#1a1300);border:1px solid #806000;color:#ffe08a;border-radius:16px;padding:12px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 0,rgba(47,109,255,.25),transparent 50%),radial-gradient(circle at 90% 100%,rgba(229,48,63,.22),transparent 50%),var(--bg)}
.login .box{width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.login img{width:96px;height:114px;object-fit:contain;margin:0 auto}
.arts{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.arts img{width:100%;border-radius:12px;border:1px solid var(--line)}
pre.rep{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:.86rem;margin:0;max-height:260px;overflow:auto}
.mais{display:grid;gap:8px}
.list-sep{border:0;border-top:1px solid var(--line);margin:4px 0}
@media(min-width:900px){.nav{left:50%;transform:translateX(-50%);max-width:720px;border:1px solid var(--line);border-radius:18px 18px 0 0}}
</style>

<div id="app"></div>
<script>
'use strict';
/* =================== Utilidades =================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mesLabel = m => { if (!m) return ''; const [y, mm] = String(m).split('-'); return (MESES[+mm - 1] || mm) + ' de ' + y; };
const mesCurto = m => { if (!m) return ''; const [, mm] = String(m).split('-'); return MESES[+mm - 1] || mm; };
const fmtData = s => { if (!s) return ''; const [y, m, d] = String(s).split('-'); return d ? `${d}/${m}/${y}` : s; };
const fmtDataCurta = s => { if (!s) return ''; const [, m, d] = String(s).split('-'); return d ? `${d}/${m}` : s; };
const diaSemana = s => { if (!s) return ''; const dt = new Date(s + 'T12:00:00'); return isNaN(dt) ? '' : dt.toLocaleDateString('pt-BR', { weekday: 'long' }); };
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const mesDeHoje = () => hojeISO().slice(0, 7);
const proxMes = m => { let [y, mm] = m.split('-').map(Number); mm++; if (mm > 12) { mm = 1; y++; } return y + '-' + String(mm).padStart(2, '0'); };
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const media = u => { u = String(u || '').trim(); if (!u) return ''; if (/^(https:|data:image\/)/.test(u)) return u; if (u.startsWith('/')) return u; if (/^[\w./-]+\.(png|jpe?g|webp|gif)$/i.test(u)) return '/' + u.replace(/^\.?\//, ''); return ''; };
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const POS = ['Goleiro', 'Zagueiro', 'Meio-campo', 'Atacante'];
const POS_AB = { 'Goleiro': 'GOL', 'Zagueiro': 'ZAG', 'Meio-campo': 'MC', 'Atacante': 'ATA' };
const IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  field: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/><circle cx="12" cy="12" r="3"/>',

async function reduzirFoto(file) {
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const L = 400, c = document.createElement('canvas'); c.width = L; c.height = L; const x = c.getContext('2d');
  const s = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - s) / 2, sy = Math.max(0, (img.naturalHeight - s) * 0.25);
  x.drawImage(img, sx, sy, s, s, 0, 0, L, L);
  let d = c.toDataURL('image/webp', 0.82); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.85);
  return d;
}

    <div class="field" style="text-align:left"><label for="lu">Usuário</label><input id="lu" name="username" autocomplete="username" autocapitalize="characters" required></div>
    <div class="field" style="text-align:left"><label for="lp">Senha</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn pri full" type="submit" id="lbtn">Entrar</button>

  $('#flogin').addEventListener('submit', async ev => {

    try {

    } catch (e) { telaLogin('Sem conexão com a internet.'); }

}
